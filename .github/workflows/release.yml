name: Release
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
# Select an existing tag in the dispatch UI. A branch cannot obtain a release identity.
permissions: {}
concurrency:
  group: dockge2-release-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      GHCR_IMAGE: ghcr.io/mazixs/dockge2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require a tag identity
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = tag
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Resolve an existing immutable publication
        id: publication
        run: |
          node -e 'const p=require("./package.json");if(process.env.TAG!=="v"+p.version)process.exit(1)'
          gh api --paginate --slurp repos/mazixs/dockge2/releases > "$RUNNER_TEMP/releases.json"
          node --input-type=module -e 'import fs from "node:fs"; const releases=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/releases.json")).flat();const old=releases.find(r=>r.tag_name===process.env.TAG);if(old?.draft)throw Error("Inspect incomplete draft before retrying");fs.appendFileSync(process.env.GITHUB_OUTPUT,"reuse="+Boolean(old)+"\n")'
      - name: Check the tagged source
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test:install
          npm run build:frontend
          npm run check:bundle
          npm run test:docker-integration
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Authenticate the candidate publisher
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the candidate once
        if: steps.publication.outputs.reuse != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          docker buildx build --platform linux/amd64,linux/arm64 --target release -f docker/Dockerfile . \
            --tag "$GHCR_IMAGE:candidate-$GITHUB_SHA-$GITHUB_RUN_ID" --push --provenance=mode=max --sbom=true \
            --label "org.opencontainers.image.version=${TAG#v}" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/build.json"
          DIGEST=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          docker buildx imagetools inspect "$GHCR_IMAGE@$DIGEST" --raw > "$RUNNER_TEMP/index.json"
          cp docker-compose.yml install.sh "$RUNNER_TEMP/release/"
          for arch in amd64 arm64; do
            (cd extra/updater && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "$RUNNER_TEMP/release/dockge2-update-linux-$arch" .)
          done
          node extra/release/manifest.mjs "$RUNNER_TEMP/release" "$GHCR_IMAGE" "$DIGEST" "$RUNNER_TEMP/index.json" "$TAG"
      - name: Install the pinned verifier
        run: bash extra/release/verifier.sh
      - name: Load the existing release without rebuilding or replacing it
        if: steps.publication.outputs.reuse == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release"
          test "$(jq -er .commit "$RUNNER_TEMP/release/release.json")" = "$GITHUB_SHA"
          test "$(jq -er .version "$RUNNER_TEMP/release/release.json")" = "${TAG#v}"
          echo "DIGEST=$(jq -er .digest "$RUNNER_TEMP/release/release.json")" >> "$GITHUB_ENV"
          chmod 700 "$RUNNER_TEMP/release/"dockge2-update-linux-*
      - name: Sign the immutable release contract and host binaries
        if: steps.publication.outputs.reuse != 'true'
        run: |
          for file in release.json dockge2-update-linux-amd64 dockge2-update-linux-arm64; do
            cosign sign-blob --yes --bundle "$RUNNER_TEMP/release/$file.sigstore.json" "$RUNNER_TEMP/release/$file"
            cosign verify-blob --bundle "$RUNNER_TEMP/release/$file.sigstore.json" \
              --certificate-identity "https://github.com/mazixs/dockge2/.github/workflows/release.yml@refs/tags/$TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$RUNNER_TEMP/release/$file"
          done
      - name: Verify existing artifacts before executing any of them
        if: steps.publication.outputs.reuse == 'true'
        run: |
          for file in release.json dockge2-update-linux-amd64 dockge2-update-linux-arm64; do
            cosign verify-blob --bundle "$RUNNER_TEMP/release/$file.sigstore.json" \
              --certificate-identity "https://github.com/mazixs/dockge2/.github/workflows/release.yml@refs/tags/$TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$RUNNER_TEMP/release/$file"
          done
      - name: Test anonymous access and upgrade/restore on both image architectures
        run: |
          PREVIOUS=$(node extra/release/previous.mjs "$RUNNER_TEMP/releases.json" "${TAG#v}")
          for arch in amd64 arm64; do
            DOCKER_DEFAULT_PLATFORM="linux/$arch" bash test/install/docker.sh "$RUNNER_TEMP/release" "$arch" "$RUNNER_TEMP/cosign"
            if [[ -n "$PREVIOUS" ]]; then
              DOCKER_DEFAULT_PLATFORM="linux/$arch" bash test/install/managed.sh "$RUNNER_TEMP/release" "$arch" "$RUNNER_TEMP/cosign" "$PREVIOUS"
            fi
            DOCKER_DEFAULT_PLATFORM="linux/$arch" bash test/install/unmanaged.sh "$RUNNER_TEMP/release" "$arch" "$RUNNER_TEMP/cosign"
          done
      - name: Sign and publish the tested version without moving stable
        if: steps.publication.outputs.reuse != 'true'
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$GHCR_IMAGE:${TAG#v}" "$GHCR_IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$GHCR_IMAGE:${TAG#v}" --format '{{json .Manifest}}' | jq -er .digest)" = "$DIGEST"
          extra=()
          [[ "$TAG" == *-* ]] && extra+=(--prerelease)
          notes=(--generate-notes)
          [[ -f "docs/releases/${TAG#v}.md" ]] && notes=(--notes-file "docs/releases/${TAG#v}.md")
          gh release create "$TAG" "$RUNNER_TEMP/release/"* --verify-tag --title "$TAG" "${notes[@]}" --latest=false "${extra[@]}"
      - name: Verify public assets before advertising stable
        run: |
          mkdir "$RUNNER_TEMP/public-release"
          for file in "$RUNNER_TEMP/release/"*; do
            name=$(basename "$file")
            curl --proto '=https' --proto-redir '=https' -fsSL --max-time 180 "https://github.com/mazixs/dockge2/releases/download/$TAG/$name" -o "$RUNNER_TEMP/public-release/$name"
            cmp "$file" "$RUNNER_TEMP/public-release/$name"
          done
          node extra/release/promotion.mjs "$RUNNER_TEMP/release/release.json"
