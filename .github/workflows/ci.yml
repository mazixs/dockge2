name: Node.js CI - Dockge2

on:
  push:
    branches: [main]
    # '*.md' covered the root only, so editing one page under docs/ ran Docker
    # and the browser suite in full. The plans and audits under docs/ are pages,
    # not code: '**.md' plus '**.html' is what was meant.
    paths-ignore:
      - '**.md'
      - '**.html'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.html'
      - 'docs/**'

permissions:
  contents: read

jobs:
  ci:
    name: Node.js ${{ matrix.node-version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux only: the panel drives Docker through the host socket. Checks that do
        # not depend on the Node version run once, on the version .nvmrc pins.
        include:
          - node-version: "24.19.0"
            static-checks: true
          - node-version: "22.23.2"
            static-checks: false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: matrix.static-checks
        run: npm run lint

      - name: Check Typescript
        if: matrix.static-checks
        run: npm run check-ts

      - name: Check single file components
        if: matrix.static-checks
        run: npm run check-vue

      # Pinned by digest: the runner image carries an older shellcheck
      - name: Check shell scripts
        if: matrix.static-checks
        run: npm run lint:sh

      - name: Test with coverage and subsystem floors
        run: npm run test

      - name: Build
        run: npm run build:frontend

      - name: Check the first load against its budget
        if: matrix.static-checks
        run: npm run check:bundle

      - name: Verified updater and bootstrap contracts
        if: matrix.static-checks
        run: npm run test:install

  docker-integration:
    name: Docker Compose integration
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show Docker Compose version
        run: docker compose version

      # The suite starts a separate panel with NODE_ENV=production, which exits
      # without frontend-dist/index.html
      - name: Build the frontend
        run: npm run build:frontend

      - name: Test with real Docker Compose
        run: npm run test:docker-integration

  e2e:
    name: Browser end to end
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end to end tests
        run: npm run test:e2e

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  visual:
    name: Reference screenshots
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    # The image the references are approved in, see test/visual/run.sh
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compare with the references
        run: npx playwright test --config playwright-visual.config.ts

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-differences
          path: test-results/
          retention-days: 7
