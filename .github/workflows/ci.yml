name: Node.js CI - Dockge2

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'

permissions:
  contents: read

jobs:
  ci:
    name: Node.js ${{ matrix.node-version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Только Linux: панель управляет Docker через сокет хоста и запускает
        # docker compose, README поддержку Windows не обещает, а красный CI
        # на неподдерживаемой системе никому ничего не говорит
        node-version: ["22.23.2", "24.19.0"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check Typescript
        run: npm run check-ts

      - name: Test with coverage
        run: npm run test

      - name: Build
        run: npm run build:frontend

      - name: Check update command (dry run)
        run: npm run update-docker -- --dry-run

  docker-integration:
    name: Docker Compose integration
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show Docker Compose version
        run: docker compose version

      - name: Test with real Docker Compose
        run: npm run test:docker-integration

  e2e:
    name: Browser end to end
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end to end tests
        run: npm run test:e2e

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
