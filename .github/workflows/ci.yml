name: Node.js CI - Dockge2

on:
  push:
    branches: [main]
    # '*.md' covered the root only, so editing one page under docs/ ran Docker
    # and the browser suite in full. The plans and audits under docs/ are pages,
    # not code: '**.md' plus '**.html' is what was meant.
    paths-ignore:
      - '**.md'
      - '**.html'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.html'
      - 'docs/**'

permissions:
  contents: read

jobs:
  ci:
    name: Node.js ${{ matrix.node-version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Только Linux: панель управляет Docker через сокет хоста и запускает
        # docker compose, README поддержку Windows не обещает, а красный CI
        # на неподдерживаемой системе никому ничего не говорит
        node-version: ["22.23.2", "24.19.0"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check Typescript
        run: npm run check-ts

      - name: Check single file components
        run: npm run check-vue

      - name: Test with coverage and subsystem floors
        run: npm run test

      - name: Build
        run: npm run build:frontend

      - name: Check the first load against its budget
        run: npm run check:bundle

      - name: Verified updater and bootstrap contracts
        run: npm run test:install

  docker-integration:
    name: Docker Compose integration
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show Docker Compose version
        run: docker compose version

      # Тест поднимает отдельный экземпляр панели с NODE_ENV=production, а в этом
      # режиме бэкенд без frontend-dist/index.html выходит с кодом 1
      - name: Build the frontend
        run: npm run build:frontend

      - name: Test with real Docker Compose
        run: npm run test:docker-integration

  e2e:
    name: Browser end to end
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end to end tests
        run: npm run test:e2e

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
