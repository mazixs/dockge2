services:
  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    ports:
      # Host Port : Container Port
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
        
      # If you want to use private registries, you need to share the auth file with Dockge:
      # - /root/.docker/:/root/.docker

      # Stacks Directory
      # ⚠️ READ IT CAREFULLY. If you did it wrong, your data could end up writing into a WRONG PATH.
      # ⚠️ 1. FULL path only. No relative path (MUST)
      # ⚠️ 2. Left Stacks Path === Right Stacks Path (MUST)
      - /opt/stacks:/opt/stacks
    environment:
      # Tell Dockge where is your stacks directory
      - DOCKGE_STACKS_DIR=/opt/stacks

      # Behind a reverse proxy that terminates TLS, uncomment both: the first makes
      # Dockge read the proxy headers, the second marks the session cookie as Secure.
      # - DOCKGE_TRUST_PROXY=true
      # - DOCKGE_SECURE_COOKIES=true

      # Only needed when the UI is served from a different origin than the API,
      # for example a separate frontend host. Comma separated list.
      # - DOCKGE_TRUSTED_ORIGINS=https://dockge.example.com
